<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kas · Club Treasury</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>
<div id="login" class="center hidden">
  <div class="card login">
    <div class="logo big">Kas<span>.</span></div>
    <p class="muted" id="appName"></p>
    <p>Rekod duit club dengan resit, kelulusan presiden, bajet event dan kalendar program.</p>
    <button class="btn google" onclick="signIn()"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Log masuk dengan Google</button>
    <p class="small muted" id="loginMsg"></p>
  </div>
</div>

<div id="noaccess" class="center hidden">
  <div class="card login">
    <div class="logo big">Kas<span>.</span></div>
    <h2>Belum ada akses club</h2>
    <p>Kau log masuk sebagai <b id="naEmail"></b>, tapi email ni belum dijemput ke mana-mana club.</p>
    <p class="muted">Minta presiden club atau admin SRC jemput email ni, kemudian tekan semak semula.</p>
    <div class="row"><button class="btn p" onclick="boot()">Semak semula</button><button class="btn" onclick="signOut()">Log keluar</button></div>
  </div>
</div>

<div id="app" class="app hidden">
  <aside id="side">
    <div><div class="logo">Kas<span>.</span></div><div class="sub" id="appName2"></div></div>
    <div><label>Club</label><select id="clubSel"></select><div class="sub" id="myRole" style="margin-top:6px"></div></div>
    <nav id="nav"></nav>
    <div class="who"><div class="row"><img id="avatar" class="av" alt=""><div><b id="meName"></b><div class="sub" id="meEmail"></div></div></div>
      <button class="btn s" style="margin-top:10px" onclick="signOut()">Log keluar</button></div>
  </aside>
  <main id="main"><div class="empty">Memuatkan…</div></main>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="card" id="modalBody"></div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
